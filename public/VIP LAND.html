<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FGURL VIP</title>
    <link rel="stylesheet" href="VIP LAND.css">
</head>
<body>

    <div class="auth-wrapper">
        <div class="job-card" style="width: 100%; max-width: 340px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin: 0 auto;">
            <h2 id="formTitle" style="margin-bottom: 20px; color: #1a202c; font-size: 24px;">FGURL VIP</h2>
            
            <form id="authForm">
                <div class="input-group">
                    <input type="text" id="username" required placeholder=" ">
                    <label for="username">Username</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" required placeholder=" ">
                    <label for="password">Password</label>
                </div>
                <button type="submit" id="submitBtn" class="btn">Sign In</button>
                <p id="toggleText" style="margin-top:15px; font-size:14px; color:#667eea; cursor:pointer; font-weight:600;">Need a premium account? Register here</p>
                <p id="message" class="message"></p>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="VIP LAND.js"></script>
</body>
</html>
